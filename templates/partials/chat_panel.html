<header class="chat-intro">
  <div class="chat-intro__row">
    <div>
      <h1 id="ask-heading">Ask RideSafe</h1>
      <p>
        Ask about Imus traffic trends, barangay risk, and how to use the
        dashboard. Guest users: 3 questions per hour. Admin mode unlocks
        unlimited questions.
      </p>
    </div>
    <p id="chat-quota" class="chat-quota" aria-live="polite">
      Guest · 3 questions / hour
    </p>
  </div>
</header>

<section class="chat-panel card-viz" aria-label="Chat">
  <div
    id="chat-messages"
    class="chat-messages"
    role="log"
    aria-live="polite"
  >
    <!-- Populated by chat.js from sessionStorage -->
  </div>

  <form id="chat-form" class="chat-form">
    <label class="visually-hidden" for="chat-input">Your question</label>
    <textarea
      id="chat-input"
      name="message"
      rows="2"
      maxlength="1000"
      placeholder="Ask about a barangay, hour, or citywide trend…"
      required
    ></textarea>
    <button type="submit" id="chat-send" class="btn btn--accent">
      Send
    </button>
  </form>
  <p id="chat-status" class="chat-status" hidden></p>
</section>
