<div
  id="admin-modal"
  class="modal"
  hidden
  role="dialog"
  aria-modal="true"
  aria-labelledby="admin-modal-title"
>
  <div class="modal__backdrop" data-close-modal></div>
  <div class="modal__panel card-viz">
    <h2 id="admin-modal-title">Admin access</h2>
    <p class="modal__hint">
      Enter the admin password for unlimited chat questions this session.
    </p>
    <form id="admin-login-form" class="modal__form">
      <label class="visually-hidden" for="admin-password">Password</label>
      <input
        id="admin-password"
        type="password"
        name="password"
        autocomplete="current-password"
        placeholder="Password"
        required
      />
      <p id="admin-login-error" class="modal__error" hidden></p>
      <div class="modal__actions">
        <button type="button" class="btn" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn--accent">Unlock</button>
      </div>
    </form>
    <button
      type="button"
      id="admin-logout-btn"
      class="btn modal__logout"
      hidden
    >
      Exit admin mode
    </button>
  </div>
</div>
